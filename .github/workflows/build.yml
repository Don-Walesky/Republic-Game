# NOTE: Actions runs since the cabinet commit fail before checkout because of the billing lock. Local `dotnet test Republic.sln` is the verification gate until the lock is cleared.
name: Build and Test

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Republic.sln

      - name: Build
        run: dotnet build Republic.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Republic.sln --configuration Release --no-build --collect:"XPlat Code Coverage"
